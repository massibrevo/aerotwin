[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aerotwin"
version = "0.6.0"
description = "Local-first aviation data science and assumption-based digital twin"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "numpy>=2,<3", "pandas>=2.2,<3", "pyarrow>=18", "duckdb>=1.1,<2", "scikit-learn>=1.6,<2", "networkx>=3.4,<4", "simpy>=4.1,<5", "joblib>=1.4,<2", "tzdata>=2024.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
